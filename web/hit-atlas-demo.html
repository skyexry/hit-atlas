&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(

  );

  initialStateElement?.remove();

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      fileElement.remove();

      const urls = [];

      get bindings() {

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */

        return () =&gt; {};

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {

      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

        return;
      }

      element = event.target;

    }

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;hit-atlas-views&#x27;);
  const screen = root.querySelector(&#x27;[data-screen]&#x27;);
  const d = JSON.parse(document.getElementById(&#x27;hit-atlas-views-data&#x27;).textContent);
  const years = Object.keys(d.scopes.Global);
  const labels = [&#x27;悲伤&#x27;,&#x27;愤怒&#x27;,&#x27;恐惧&#x27;,&#x27;厌恶&#x27;,&#x27;惊讶&#x27;,&#x27;信任&#x27;,&#x27;期待&#x27;,&#x27;快乐&#x27;];
  const keys = [&#x27;sadness&#x27;,&#x27;anger&#x27;,&#x27;fear&#x27;,&#x27;disgust&#x27;,&#x27;surprise&#x27;,&#x27;trust&#x27;,&#x27;anticipation&#x27;,&#x27;joy&#x27;];
  const metrics = [{label:&#x27;歌词重复度&#x27;,unit:&#x27;%&#x27;,max:100},{label:&#x27;节拍速度&#x27;,unit:&#x27; BPM&#x27;,max:200},{label:&#x27;能量&#x27;,unit:&#x27; / 100&#x27;,max:100},{label:&#x27;可舞性&#x27;,unit:&#x27; / 100&#x27;,max:100}];
  const trackSamples = d.clips.map(id =&gt; [id, d.songs[id].title]);
  const radarLimit = Math.max(5, Math.ceil(Math.max(...Object.values(d.songs).flatMap(song =&gt; song.score || []))/5)*5);
  const state = {view:&#x27;global&#x27;, year:&#x27;2026&#x27;, regionYear:&#x27;2026&#x27;, market:&#x27;Hong Kong&#x27;, artist:&#x27;The Weeknd&#x27;, metric:0, track:d.clips[0], emotion:0};
  const escape = value =&gt; String(value ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, word =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;})[word]);
  const fmt = (value, digits=1) =&gt; value == null ? &#x27;—&#x27; : Number(value).toFixed(digits).replace(/\.0+$/,&#x27;&#x27;);
  const metricText = (value, meta) =&gt; value == null ? &#x27;—&#x27; : `${fmt(value)}${meta.unit}`;
  const select = (label, action, pairs, active) =&gt; `&lt;label&gt;${escape(label)}&lt;select data-action=&quot;${action}&quot;&gt;${pairs.map(([key,value]) =&gt; `&lt;option value=&quot;${escape(key)}&quot;${String(key) === String(active) ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;${escape(value)}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;`;
  function list(entries, title, description, artist=false) {
    return `&lt;section class=&quot;ha-card&quot; aria-label=&quot;${escape(title)}&quot;&gt;&lt;h2&gt;${escape(title)}&lt;/h2&gt;&lt;p class=&quot;ha-muted&quot;&gt;${escape(description)}&lt;/p&gt;&lt;ol class=&quot;ha-rank&quot;&gt;${entries.map(([rank,id,year,count]) =&gt; {
      const item = d.songs[id];
      const sub = artist ? `最佳名次 · ${year} · ${count} 次上榜` : item.artist;
      return `&lt;li&gt;&lt;button type=&quot;button&quot; data-song=&quot;${id}&quot; aria-label=&quot;查看 ${escape(item.title)}&quot;&gt;&lt;span class=&quot;ha-num&quot;&gt;${String(rank).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;b&gt;${escape(item.title)}&lt;/b&gt;&lt;small&gt;${escape(sub)}&lt;/small&gt;&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/li&gt;`;
    }).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;/section&gt;`;
  }

  function globalView() {
    const meta = metrics[state.metric];
    const current = d.scopes.Global[state.year];
    const [value,count] = current.values[state.metric];
    const plot = years.map((year,i) =&gt; [i * 53 + 15, 128 - (d.scopes.Global[year].values[state.metric][0] / meta.max) * 112]);
    const line = plot.map(x =&gt; x.join(&#x27;,&#x27;)).join(&#x27; &#x27;);
    return `&lt;div class=&quot;ha-grid&quot;&gt;&lt;section class=&quot;ha-card&quot; aria-label=&quot;全球趋势&quot;&gt;&lt;div class=&quot;ha-top&quot;&gt;&lt;div&gt;&lt;h2&gt;全球年度 Top 50&lt;/h2&gt;&lt;p class=&quot;ha-muted&quot;&gt;按榜位等权平均 · 2026 年截至 11 月 12 日&lt;/p&gt;&lt;/div&gt;${select(&#x27;指标&#x27;,&#x27;metric&#x27;,metrics.map((m,i)=&gt;[i,m.label]),state.metric)}&lt;/div&gt;
      &lt;div class=&quot;ha-kpi&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;${escape(metricText(value,meta))}&lt;/strong&gt;&lt;span class=&quot;ha-muted&quot;&gt;${state.year} · ${meta.label} · ${count}/50 个榜位&lt;/span&gt;&lt;/div&gt;
      &lt;svg class=&quot;ha-chart&quot; viewBox=&quot;0 0 507 138&quot; role=&quot;img&quot; aria-label=&quot;${meta.label}在 2017 至 2026 年的平均值折线图&quot;&gt;${[16,44,72,100,128].map(x=&gt;`&lt;line class=&quot;ha-gridline&quot; x1=&quot;15&quot; y1=&quot;${x}&quot; x2=&quot;492&quot; y2=&quot;${x}&quot;/&gt;`).join(&#x27;&#x27;)}&lt;polyline class=&quot;ha-trace&quot; fill=&quot;none&quot; points=&quot;${line}&quot;/&gt;${plot.map(([x,y],i) =&gt; `&lt;circle class=&quot;ha-point ${years[i]===state.year?&#x27;current&#x27;:&#x27;&#x27;}&quot; cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;${years[i]===state.year?5:3.4}&quot; data-tooltip=&quot;${years[i]} · ${escape(metricText(d.scopes.Global[years[i]].values[state.metric][0],meta))}&quot;&gt;&lt;title&gt;${years[i]} ${escape(metricText(d.scopes.Global[years[i]].values[state.metric][0],meta))}&lt;/title&gt;&lt;/circle&gt;`).join(&#x27;&#x27;)}&lt;/svg&gt;
      &lt;div class=&quot;ha-years&quot; aria-label=&quot;选择年份&quot;&gt;${years.map(y=&gt;`&lt;button type=&quot;button&quot; data-year=&quot;${y}&quot; aria-pressed=&quot;${y===state.year}&quot;&gt;${y}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      &lt;p class=&quot;ha-note&quot;&gt;刻度 0—${meta.max}${escape(meta.unit)} · ${state.metric===0?&#x27;The Pudding 重复度&#x27;:&#x27;ReccoBeats 同口径&#x27;}&lt;/p&gt;&lt;/section&gt;
      ${list(current.songs, `${state.year} 全球榜`, &#x27;Top 50 中的前 6 首&#x27;)}&lt;/div&gt;`;
  }

  function marketView() {
    const meta = metrics[state.metric];
    const active = d.scopes[state.market][state.regionYear];
    return `&lt;div class=&quot;ha-grid&quot;&gt;&lt;section class=&quot;ha-card&quot;&gt;&lt;h2&gt;同一年，各地热门歌曲&lt;/h2&gt;&lt;p class=&quot;ha-muted&quot;&gt;4 个地区示例 · 每年 1 月 1 日至 11 月 12 日的同期榜&lt;/p&gt;
      &lt;div class=&quot;ha-controls&quot;&gt;${select(&#x27;年份&#x27;,&#x27;regionYear&#x27;,Object.keys(d.scopes[state.market]).map(y=&gt;[y,y]),state.regionYear)}${select(&#x27;指标&#x27;,&#x27;metric&#x27;,metrics.map((m,i)=&gt;[i,m.label]),state.metric)}&lt;/div&gt;
      &lt;div class=&quot;ha-markets&quot; aria-label=&quot;选择地区&quot;&gt;${Object.entries(d.markets).map(([market,name])=&gt;{const [v,n]=d.scopes[market][state.regionYear].values[state.metric]; return `&lt;button class=&quot;ha-market&quot; type=&quot;button&quot; data-market=&quot;${market}&quot; aria-pressed=&quot;${market===state.market}&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;span class=&quot;ha-bar&quot; aria-hidden=&quot;true&quot;&gt;&lt;span style=&quot;width:${Math.max(0,v||0)/meta.max*100}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ha-barvalue&quot;&gt;${escape(metricText(v,meta))} · ${n}/50&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;ha-note&quot;&gt;${meta.label}平均值 · 有值榜位 / 50&lt;/p&gt;&lt;/section&gt;
      ${list(active.songs, `${d.markets[state.market]} · ${state.regionYear}`, &#x27;同期榜前 6 首&#x27;)}&lt;/div&gt;`;
  }

  function artistView() {
    const {counts,songs} = d.artists[state.artist];
    const max = Math.max(1,...counts);
    return `&lt;div class=&quot;ha-grid&quot;&gt;&lt;section class=&quot;ha-card&quot;&gt;&lt;div class=&quot;ha-top&quot;&gt;&lt;div&gt;&lt;h2&gt;${escape(state.artist)}&lt;/h2&gt;&lt;p class=&quot;ha-muted&quot;&gt;全球年度 Top 50 的上榜分布&lt;/p&gt;&lt;/div&gt;${select(&#x27;歌手&#x27;,&#x27;artist&#x27;,Object.keys(d.artists).map(v=&gt;[v,v]),state.artist)}&lt;/div&gt;
      &lt;div class=&quot;ha-kpi&quot;&gt;&lt;strong&gt;${counts.reduce((a,b)=&gt;a+b,0)}&lt;/strong&gt;&lt;span class=&quot;ha-muted&quot;&gt;个全球榜位 · 2017—2026&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;ha-columns&quot; role=&quot;img&quot; aria-label=&quot;逐年上榜次数：${years.map((y,i)=&gt;`${y} 年 ${counts[i]} 次`).join(&#x27;，&#x27;)}&quot;&gt;${counts.map((count,i)=&gt;`&lt;div class=&quot;ha-column&quot; data-tooltip=&quot;${years[i]} 年 · ${count} 次&quot;&gt;${count}&lt;span aria-hidden=&quot;true&quot; style=&quot;height:${count/max*100}%&quot;&gt;&lt;/span&gt;&lt;small&gt;${years[i].slice(2)}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;ha-note&quot;&gt;按榜位计数 · 同一首歌可以多次上榜&lt;/p&gt;&lt;/section&gt;
      ${list(songs, &#x27;代表上榜歌曲&#x27;, &#x27;按最佳名次排序 · 最多 8 首&#x27;,true)}&lt;/div&gt;`;
  }

  function radar(song) {
    const point = (i,len) =&gt; [147 + Math.sin(i*Math.PI/4)*len, 109 - Math.cos(i*Math.PI/4)*len];
    const points = vals =&gt; vals.map((x,i)=&gt;point(i,x).join(&#x27;,&#x27;)).join(&#x27; &#x27;);
    const limit = radarLimit;
    return `&lt;svg class=&quot;ha-radar&quot; viewBox=&quot;0 0 294 218&quot; role=&quot;img&quot; aria-label=&quot;八类情绪词次率雷达图，每百词，统一 0 到 ${limit} 刻度&quot;&gt;&lt;title&gt;${labels.map((label,i)=&gt;`${label} ${fmt(song.score[i],2)}`).join(&#x27;、&#x27;)}&lt;/title&gt;
      ${[16,32,48,64,80].map(r=&gt;`&lt;polygon class=&quot;ha-gridline&quot; points=&quot;${points(keys.map(()=&gt;r))}&quot; fill=&quot;none&quot;/&gt;`).join(&#x27;&#x27;)}
      ${keys.map((_,i)=&gt;{const [x,y]=point(i,80);return `&lt;line class=&quot;ha-gridline&quot; x1=&quot;147&quot; y1=&quot;109&quot; x2=&quot;${x}&quot; y2=&quot;${y}&quot;/&gt;`;}).join(&#x27;&#x27;)}
