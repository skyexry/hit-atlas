<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>美国年终热歌 · 1959–2023</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#222c28;font:16px/1.55 "DM Sans","PingFang SC",system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:clamp(16px,3vw,46px)}header{border-bottom:1px solid #aaa99c;padding-bottom:15px}.brand{font:small-caps 15px Georgia,serif;letter-spacing:.13em;color:#566d62}h1{font:600 clamp(30px,4.2vw,58px)/1.17 Georgia,"Songti SC",serif;margin:.24em 0}h2{font-size:clamp(22px,2.7vw,34px);margin:18px 0 4px}h3{font-size:18px;margin:12px 0 3px}.quiet,small{color:#505d55}p{margin:4px 0 12px}button,select,input{font:inherit;color:inherit}button,select,input[type=text]{padding:5px 10px;background:#fffdf7;border:1px solid #c4c7bb;border-radius:5px}button{cursor:pointer}button[aria-pressed=true]{background:#214c40;color:white;border-color:#214c40}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #be773a;outline-offset:2px}nav,.tools,.timeline,.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{margin:18px 0}.timeline{padding:9px 12px;background:#ebece3}.timeline input{flex:1;min-width:100px;accent-color:#286450}.timeline label{font-size:14px}.tools{margin:10px 0}.legend button{padding:3px 7px;font-size:13px}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.figure{width:100%;display:block;height:auto}.figure text{font:12px sans-serif;fill:#4b5a51}.maps{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mapCard{background:#fcfbf5;border:1px solid #d1d3c9;padding:10px;min-width:0}.mapCard svg{display:block;width:100%;background:#edf2ef}.mapCard path,.mapCard circle{cursor:pointer}.note{font-size:14px;color:#58645b}.details{border-top:1px solid #acae9f;margin-top:18px;padding-top:4px}.rows{max-height:285px;overflow:auto}.row{padding:6px 0;border-bottom:1px solid #dddfd4;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px}.row span{overflow-wrap:anywhere}.row span:nth-child(2){color:#5f695f}.row a,a{color:#265c4b}.legend{margin-top:8px}label{display:inline-flex;align-items:center;gap:5px}#words{width:210px;max-width:65vw}.timeline select{font-weight:700}footer{font-size:14px;margin-top:24px;color:#556157}footer a{margin-right:12px}[hidden]{display:none!important}@media(max-width:720px){.maps{grid-template-columns:1fr}.row{font-size:14px;gap:5px}.tools{gap:5px}}
</style><main><header><div class="brand">Billboard · Year-End Hot 100</div><h1>美国年终热歌，1959–2023</h1><p id="summary" class="quiet">正在读取本地数据…</p></header><nav aria-label="视图"><button data-tab="genre">歌曲曲风</button><button data-tab="map">艺人来源</button><button data-tab="words">歌词用词</button></nav>
<div class="timeline"><label for="year">上榜年</label><select id="year"></select><input id="slider" aria-label="年度滑条" type="range" min="1959" max="2023" value="2023"></div>
<h2 id="heading"></h2><p class="quiet" id="desc"></p><div class="tools" id="wordTools" hidden><form id="wordForm"><label>查词 <input id="words" type="text" value="love, hope, hate" aria-label="查询词，用逗号分开"></label> <button>查询</button></form><label>指标 <select id="measure"><option value="share">唱到该词的歌曲占比</option><option value="rate">每千词出现次数</option></select></label><label><input id="smooth" type="checkbox">近五年移动平均</label></div>
<section id="mapTools" hidden><label>来源地 <select id="country"></select></label><div class="maps" id="maps"></div><p class="note">圆面积表示该地艺人占已知来源艺人的比例。两图使用相同刻度，浅色陆地为地理底图。点国家或圆点可看艺人。</p><h3>每年有多少个已知来源地？</h3></section>
<svg id="chart" class="figure" role="img" aria-label="年度趋势图"></svg><div id="legend" class="legend"></div>
<section class="details"><h3 id="detail"></h3><p class="note" id="counts" aria-live="polite"></p><div class="rows" id="rows"></div></section><footer><a href="coverage.csv">逐年覆盖表</a><a href="chart_entries.csv">完整榜位</a><a href="README.md">数据与计算口径</a></footer></main>
<script id="packed" type="application/octet-stream">DATA_PAYLOAD</script>
<script>
'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const years=Array.from({length:65},(_,i)=>1959+i), colors={'Pop':'#cf705b','Rock':'#50816d','R&B':'#d6a84e','Soul':'#a77995','Hip Hop/Rap':'#4c6695','Country':'#b08659','Folk':'#91aa73','Funk':'#9587af','Disco':'#ce956d','Dance/Electronic':'#5b9aa8','Indie':'#c4b875','Jazz/Swing':'#718776','Latin':'#ac4551','Reggae':'#8d9050','未标注':'#b9baba'},ink=['#225c4d','#b35439','#515b99','#906e23','#924b78','#386e91'];
let D,tab='genre',year=2023,genre='',country='',terms=['love','hope','hate'],focus='love',wordStats={},genreStats={},mapStats={},ready=false;
function elt(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function button(label,active,action,color){const b=document.createElement('button');b.setAttribute('aria-pressed',active);if(color){const s=document.createElement('i');s.className='sw';s.style.background=color;b.append(s)}b.append(label);b.onclick=action;return b}
function mapSample(lo,hi){const artistSet=new Set();for(let y=lo;y<=hi;y++)for(const [,s] of D.years[y])for(const a of D.songs[s][2])artistSet.add(a);const by=new Map();for(const a of artistSet){const c=D.artists[a][1];if(!c)continue;if(!by.has(c))by.set(c,[]);by.get(c).push(a)}return {by,known:[...by.values()].reduce((a,v)=>a+v.length,0),total:artistSet.size}}
function prepare(){
 for(const y of years){const weights={};for(const [r,s,labels] of D.years[y]){const gs=labels.length?labels:['未标注'];for(const g of gs)weights[g]=(weights[g]||0)+1/gs.length}genreStats[y]=weights;mapStats[y]=mapSample(y,y)}
 for(const y of years)$('year').add(new Option(y,y));$('country').add(new Option('全部已知来源地',''));for(const [c,n] of Object.entries(D.countries).sort((a,b)=>a[1].localeCompare(b[1],'zh')))$('country').add(new Option(n,c));
 $('summary').textContent='65 届美国年终榜 · '+D.coverage.reduce((s,r)=>s+r.chart_entries,0).toLocaleString()+' 个榜位 · '+D.songs.length.toLocaleString()+' 条去重歌曲或合榜单曲记录';
}
function termData(term){
 if(wordStats[term])return wordStats[term];const raw=Object.hasOwn(D.words,term)?D.words[term]:[],cts=new Map();for(let i=0;i<raw.length;i+=2)cts.set(raw[i],raw[i+1]);const by={};
 for(const y of years){let n=0,h=0,uses=0,total=0,matched=[];for(const [rank,id] of D.years[y]){const s=D.songs[id];if(s[4]!=='en')continue;n++;total+=s[5];const k=cts.get(id)||0;if(k){h++;uses+=k;matched.push([rank,id,k])}}by[y]={n,h,uses,total,matched,share:n?100*h/n:0,rate:total?1000*uses/total:0}}
 wordStats[term]=by;return by;
}
function setYear(v){year=Math.max(1959,Math.min(2023,+v));$('year').value=year;$('slider').value=year;render()}
function chooseTab(t){tab=t;for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-pressed',b.dataset.tab===t);$('wordTools').hidden=t!=='words';$('mapTools').hidden=t!=='map';const info={genre:['哪些曲风占据了年终榜？','按当年实际榜位计算。每个榜位权重为 1，多曲风均分。点图例或色带查看对应歌曲。'],map:['上榜艺人的地理来源变广了吗？','左图固定为 1959–1963，右图随年份变化，取截至所选年的最近五年（开头年份取已有区间）。每个窗口内，同一艺人只计一次。个人取出生地，组合取成立地或资料注明的起源地。'],words:['热歌里反复唱哪些词？','输入英文单词，用逗号分隔（最多六个）。分母为有可用歌词且自动判为英语主导的上榜曲目。混唱文本可能包含其他语言。']}[t];$('heading').textContent=info[0];$('desc').textContent=info[1];setYear(year)}
function mapCard(lo,hi,active){
 const sample=mapSample(lo,hi),box=document.createElement('div');box.className='mapCard';const title=document.createElement('h3');title.textContent=(lo===hi?lo:lo+'–'+hi)+' · '+sample.by.size+' 个来源地';const note=document.createElement('small');note.textContent='已知来源 '+sample.known+'/'+sample.total+' 位，海外占已知 '+(100*(sample.known-(sample.by.get('US')||[]).length)/Math.max(1,sample.known)).toFixed(1)+'%';box.append(title,note);
 const svg=elt('svg',{viewBox:'0 0 360 148',role:'img','aria-label':title.textContent});
 function choose(c){if(!Object.hasOwn(D.countries,c))return;country=c;$('country').value=c;if(!active)year=1963;setYear(year)}
 for(const [c,path] of D.geo[0]){const el=elt('path',{d:path,fill:sample.by.has(c)?'#acc3b4':'#d9dfd8',stroke:'#fff','stroke-width':.27});el.onclick=()=>choose(c);svg.append(el)}
 for(const [c,a] of [...sample.by].sort((x,y)=>y[1].length-x[1].length)){const pos=D.geo[1][c];if(!pos)continue;const circle=elt('circle',{cx:pos[0]+180,cy:83-pos[1],r:16*Math.sqrt(a.length/sample.known),fill:country===c?'#c35b3a':'#265e52','fill-opacity':.86,stroke:'#fff','stroke-width':.32});circle.append(elt('title',{},D.countries[c]+' · '+a.length+' 位'));circle.onclick=()=>choose(c);svg.append(circle)}box.append(svg);return box;
}
function graph(){
 const svg=$('chart'),w=Math.max(320,Math.round(svg.getBoundingClientRect().width)),h=tab==='map'?144:w<550?220:265,L=44,R=12,T=21,B=29;
 svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.replaceChildren();const add=(tag,attrs,txt)=>{const el=elt(tag,attrs,txt);svg.append(el);return el},x=y=>L+(w-L-R)*(y-1959)/64;
 const metric=$('measure').value;function val(t,y){const data=termData(t);if(!$('smooth').checked)return data[y][metric];const from=Math.max(1959,y-4);let sum=0;for(let i=from;i<=y;i++)sum+=data[i][metric];return sum/(y-from+1)}
 let max=100;if(tab==='map')max=Math.max(4,Math.ceil(Math.max(...years.map(y=>mapStats[y].by.size))/4)*4);if(tab==='words')max=Math.max(1,Math.ceil(Math.max(0,...terms.flatMap(t=>years.map(y=>val(t,y))))/4)*4);
 const yy=v=>h-B-(h-T-B)*v/max;for(let j=0;j<=4;j++){const v=max*j/4;add('line',{x1:L,x2:w-R,y1:yy(v),y2:yy(v),stroke:'#dcded2'});add('text',{x:L-5,y:yy(v)+4,'text-anchor':'end'},Number(v.toFixed(2))+((tab==='genre'||tab==='words'&&metric==='share')?'%':''))}
 for(const y of years.filter(y=>y===1959||y===2023||(y%10===0&&y>1960&&y<2020)))add('text',{x:x(y),y:h-6,'text-anchor':y===1959?'start':y===2023?'end':'middle'},y);
 const pts=vs=>years.map((y,i)=>x(y)+','+yy(vs[i]));const line=(vs,color)=>add('polyline',{points:pts(vs).join(' '),fill:'none',stroke:color,'stroke-width':2.6});
 if(tab==='genre'){let lo=years.map(()=>0);for(const [g,color] of Object.entries(colors)){const hi=years.map((y,i)=>lo[i]+100*(genreStats[y][g]||0)/D.years[y].length);const a=add('polygon',{points:[...pts(hi),...pts(lo).reverse()].join(' '),fill:color,opacity:genre&&genre!==g?.22:1,'data-genre':g});a.append(elt('title',{},g));lo=hi}}
 if(tab==='map')line(years.map(y=>mapStats[y].by.size),'#336950');
 if(tab==='words')terms.forEach((t,i)=>line(years.map(y=>val(t,y)),ink[i]));
 add('line',{x1:x(year),x2:x(year),y1:T,y2:h-B,stroke:'#292d27','stroke-dasharray':'4 3','pointer-events':'none'});
 svg.onclick=e=>{const box=svg.getBoundingClientRect(),px=(e.clientX-box.left)*w/box.width;if(px<L-2||px>w-R+2)return;if(e.target.dataset.genre)genre=e.target.dataset.genre;setYear(Math.round(1959+(px-L)*64/(w-L-R)))};
}
function detail(title,caption,rows){$('detail').textContent=title;$('counts').textContent=caption;const el=$('rows');el.replaceChildren();const frag=document.createDocumentFragment();for(const row of rows){const d=document.createElement('div');d.className='row';for(let i=0;i<3;i++){const s=document.createElement('span');if(i===0&&row[3]){const a=document.createElement('a');a.href=row[3];a.target='_blank';a.rel='noreferrer';a.textContent=row[i];s.append(a)}else s.textContent=row[i];d.append(s)}frag.append(d)}el.append(frag);el.scrollTop=0}
function render(){
 if(!ready)return;const leg=$('legend');leg.replaceChildren();const rows=D.years[year],cov=D.coverage[year-1959];
 if(tab==='genre'){
 for(const g of ['',...Object.keys(colors)])leg.append(button(g||'全部',genre===g,()=>{genre=g;render()},colors[g]));
 const shown=rows.filter(r=>!genre||(r[2].length?r[2]:['未标注']).includes(genre));const share=100*(genreStats[year][genre]||0)/rows.length;
 detail(year+' · '+(genre||'全部曲风'),cov.genre_known+'/'+rows.length+' 个榜位有曲风。'+(genre?'该类涉及 '+shown.length+' 个榜位，均分权重后占 '+share.toFixed(1)+'%。':'按年终排名排列。'),shown.map(([rank,id,g])=>['#'+rank+'  '+D.songs[id][0],D.songs[id][1],g.join(' / ')||'未标注',D.songs[id][6]||'https://en.wikipedia.org/wiki/Billboard_Year-End_Hot_100_singles_of_'+year]));
 }else if(tab==='map'){
 const lo=Math.max(1959,year-4),s=mapSample(lo,year);$('maps').replaceChildren(mapCard(1959,1963,false),mapCard(lo,year,true));const arts=country?s.by.get(country)||[]:[...s.by.values()].flat();arts.sort((a,b)=>D.artists[a][0].localeCompare(D.artists[b][0]));
 detail(lo+'–'+year+' · '+(D.countries[country]||'全部已知来源地'),arts.length+' 位艺人；该窗口已知 '+s.known+'/'+s.total+' 位。下方名单链接到来源资料。',arts.map(i=>{const [n,c,type,p,url]=D.artists[i];return [n,D.countries[c]+' · '+p,({birthplace:'出生地',formation:'成立地',artist_origin:'资料所列起源地'})[type]||'',url]}));
 }else{
 terms.forEach((t,i)=>leg.append(button(t,focus===t,()=>{focus=t;render()},ink[i])));const d=termData(focus)[year];detail(year+' · '+focus,d.h+' / '+d.n+' 首英语主导歌曲唱到这个词（'+d.share.toFixed(1)+'%），共 '+d.uses+' 次，每千词 '+d.rate.toFixed(2)+' 次。可用各语种歌词 '+cov.lyrics_usable+'/'+rows.length+'。',d.matched.slice().sort((a,b)=>b[2]-a[2]).map(([rank,id,k])=>['#'+rank+'  '+D.songs[id][0],D.songs[id][1],k+' 次',D.songs[id][6]||'https://en.wikipedia.org/wiki/Billboard_Year-End_Hot_100_singles_of_'+year]));
 }
 graph();
}
$('wordForm').onsubmit=e=>{e.preventDefault();const v=[...new Set($('words').value.toLowerCase().replaceAll('’',"'").match(/[a-z]+(?:'[a-z]+)*/g)||[])].slice(0,6);if(v.length){terms=v;focus=v[0];$('words').value=v.join(', ');render()}};
for(const id of ['measure','smooth'])$(id).onchange=render;$('year').onchange=e=>setYear(e.target.value);$('slider').oninput=e=>setYear(e.target.value);$('country').onchange=e=>{country=e.target.value;render()};window.addEventListener('resize',()=>{if(ready)graph()});for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{if(ready)chooseTab(b.dataset.tab)};
(async()=>{const bytes=Uint8Array.from(atob($('packed').textContent),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(stream).text());wordStats=Object.create(null);prepare();ready=true;chooseTab('genre')})().catch(e=>{$('summary').textContent='读取失败，请用支持 gzip 解压的新版浏览器打开。';console.error(e)});
</script></html>
